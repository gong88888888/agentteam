openapi: 3.1.0
info:
  title: MiniLedger Contracts
  version: 1.0.0
  description: >-
    AgentTeam 的契约优先示例。接口契约是唯一载体，前后端类型、mock、契约测试
    都从这里生成；Agent 不得私自修改本文件。
servers:
  - url: https://api.miniledger.local/v1
paths:
  /auth/register:
    post:
      operationId: register
      summary: X1 注册
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      operationId: login
      summary: X1 登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /records:
    get:
      operationId: listRecords
      summary: X2 查询记录（只能看到自己的）
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: month
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
      responses:
        '200':
          description: 记录列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Record' }
    post:
      operationId: createRecord
      summary: X2 新增记录
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordInput' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '422':
          $ref: '#/components/responses/ValidationError'
  /records/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getRecord
      summary: X2 查询单条记录（必须校验 owner）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateRecord
      summary: X2 修改记录
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordInput' }
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: deleteRecord
      summary: X2 删除记录
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: 删除成功
        '403':
          $ref: '#/components/responses/Forbidden'
  /reports/monthly:
    get:
      operationId: monthlyReport
      summary: X3 月度聚合报表
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: month
          required: true
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
      responses:
        '200':
          description: 报表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyReport' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    Session:
      type: object
      required: [access_token, expires_at]
      properties:
        access_token: { type: string }
        expires_at: { type: string, format: date-time }
    RecordInput:
      type: object
      required: [amount, category, occurred_on]
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        category: { type: string, maxLength: 32 }
        note: { type: string, maxLength: 200 }
        occurred_on: { type: string, format: date }
    Record:
      allOf:
        - $ref: '#/components/schemas/RecordInput'
        - type: object
          required: [id, owner_id, created_at]
          properties:
            id: { type: string, format: uuid }
            owner_id: { type: string }
            created_at: { type: string, format: date-time }
    MonthlyReport:
      type: object
      required: [month, total, by_category]
      properties:
        month: { type: string }
        total: { type: number }
        by_category:
          type: array
          items:
            type: object
            required: [category, total]
            properties:
              category: { type: string }
              total: { type: number }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object }
  responses:
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 越权或无权访问
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: 参数校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
