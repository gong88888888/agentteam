- id: retro-1
  role: retro
  task: 事故：v1.2 发布后 30 分钟错误率从 0.2% 升至 4.8%；20:10 发布，20:40 告警，20:55 回滚，21:10 恢复；根因为新查询缺少索引。输出时间线、根因、行动项和验证方式。只输出
    JSON。
  keyword_groups:
  - - 时间线
    - 根因
  - - 行动项
    - 改进项
    - 行动
- id: retro-2
  role: retro
  task: 最近三次契约漂移：S1 未更新 OpenAPI、S2 未跑契约测试、S3 未经评审合并。分析流程根因，给出 owner、deadline 和验证标准。只输出
    JSON。
  keyword_groups:
  - - 根因
    - 原因
  - - 验证
    - 验收
- id: pm-1
  role: pm
  task: L2 契约变更：X1 认证响应新增 expires_at 字段；影响 S1/S2/S3 三个切片；已有契约测试与 SAST 证据，缺少回滚演练。即使缺少回滚演练，也要组装决策包并给出至少
    3 个选项及各自风险，标注待补证据。只输出 JSON。
  keyword_groups:
