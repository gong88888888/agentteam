# 说明：本项目为离线单机游戏，无 HTTP 服务。
# 本文件以 OpenAPI 3.0 结构描述“模块间契约”（逻辑层纯函数接口），
# 供代码角色与 QA 对齐签名；不表示存在网络 API。
openapi: 3.0.3
info:
  title: Maze Adventurer - Module Contracts (in-process, no HTTP)
  version: 1.0.0
  description: >
    第一章逻辑层契约。所有接口为 ES Module 纯函数，可在 node --test 下直接导入。
    不引入任何 Web 服务；此文件仅作接口契约文档。
paths: {}
components:
  schemas:
    FloorGraph:
      type: object
      required: [seed, floorIndex, rooms, mainPath, bossRoomId]
      properties:
        seed: { type: integer }
        floorIndex: { type: integer, minimum: 1, maximum: 5 }
        rooms:
          type: array
          items:
            type: object
            required: [id, type, doors, cleared]
            properties:
              id: { type: string }
              type:
                type: string
                enum: [combat, platform, treasure, shop, campfire, event, elite, boss]
              doors: { type: array, items: { type: string } }
              cleared: { type: boolean }
        mainPath: { type: array, items: { type: string } }
        bossRoomId: { type: string }
        keyDoor:
          type: object
          nullable: true
          properties:
            roomId: { type: string }
            keySourceRoomId: { type: string }
    Item:
      type: object
      required: [id, slot, quality, affixes, enhanceLevel]
      properties:
        id: { type: string }
        slot:
          type: string
          enum: [weapon, helmet, armor, boots, accessory]
        quality:
          type: string
          enum: [white, green, blue, purple, orange]
        affixes:
          type: array
          minItems: 2
          maxItems: 4
          items:
            type: object
            properties:
              key: { type: string }
              value: { type: number }
        enhanceLevel: { type: integer, minimum: 0, maximum: 9 }
        classRestrict:
          type: string
          nullable: true
          enum: [warrior, mage, ranger, null]
    SaveData:
      type: object
      required: [version, worldSlot, seed, floorIndex, player, inventory, gold, crc]
      properties:
        version: { type: integer }
        worldSlot: { type: integer, minimum: 1, maximum: 3 }
        seed: { type: integer }
        floorIndex: { type: integer }
        exploredRooms: { type: array, items: { type: string } }
        bossState: { type: object }
        player: { type: object }
        inventory: { type: object }
        gold: { type: integer, minimum: 0 }
        quests: { type: array, items: { type: object } }
        settings: { type: object }
        crc: { type: string }
    CoopScale:
      type: object
      required: [hpMul, dmgMul, goldMul]
      properties:
        hpMul: { type: number }
        dmgMul: { type: number }
        goldMul: { type: number }
  x-module-contracts:
    mapgen:
      generateFloor:
        input: { seed: integer, floorIndex: integer, chapter: integer }
        output: FloorGraph
        invariants:
          - deterministic_by_seed
          - rooms_between_8_and_12
          - exactly_one_campfire
          - exactly_one_shop
          - treasure_between_2_and_4
          - key_door_at_most_1_and_not_on_main_path
    combat:
      computeDamage:
        input: { atk: number, skillMul: number, def: number, crit: boolean, elemMul: number }
        output: { dmg: integer }
        invariants: [min_1, crit_mul_1_5]
      isInvincible:
        input: { now: number, dodgeAt: number }
        output: { invincible: boolean }
        invariants: [window_300ms, cooldown_800ms]
    loot:
      rollDrop:
        input: { source: string, seed: integer }
        output: Item
        invariants:
          - normal_weights_40_30_20_8_2
          - boss_min_blue
          - boss_purple_20_orange_5
    save:
      serialize:
        input: { state: object }
        output: SaveData
      deserialize:
        input: { raw: string }
        output: { ok: boolean, data: SaveData, fallback: boolean }
        invariants: [crc_check, fallback_to_backup, no_crash_on_corrupt]
    coop:
      scaleForPlayers:
        input: { players: integer }
        output: CoopScale
        invariants:
          - p2_1_6_1_15_1_25
          - p3_2_1_1_25_1_45
          - p4_2_6_1_35_1_65
          - boss_extra_hp_10pct
