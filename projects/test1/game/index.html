<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>迷宫冒险家 · MVP 垂直切片</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game" width="1280" height="720" aria-label="迷宫冒险家游戏画面"></canvas>

  <div id="hud" class="hud">
    <div class="hud-left">
      <div class="hud-title">迷宫冒险家 <span>MVP SLICE</span></div>
      <div class="bar hp"><div id="hp-fill"></div><span id="hp-text">120 / 120</span></div>
      <div class="hud-row"><span class="chip">金币 <b id="gold">0</b></span><span class="chip">房间 <b id="room">1/4</b></span></div>
      <div class="objective" id="objective">清空房间</div>
    </div>
    <div class="hud-right">
      <div id="loot-log" class="loot-log"></div>
      <div id="p2-hud" class="p2-hud hidden">
        <div class="bar p2"><div id="p2-fill"></div><span id="p2-text">P2</span></div>
      </div>
    </div>
    <div id="message" class="message"></div>
  </div>

  <div id="menu" class="menu">
    <div class="menu-card">
      <p class="eyebrow">2D SIDE-SCROLLING ROOM MAZE · LOCAL CO-OP</p>
      <h1>迷宫冒险家</h1>
      <p class="lede">单人完整通关，朋友来了同屏打 Boss。先选职业，再进入 4 房间垂直切片。</p>

      <div class="classes">
        <button class="class-card selected" data-class="swordsman">
          <span class="class-icon sword">⚔</span>
          <b>剑士</b>
          <small>近战 · 高容错<br>HP 120 / 伤害 22</small>
        </button>
        <button class="class-card" data-class="mage">
          <span class="class-icon mage">✦</span>
          <b>法师</b>
          <small>远程 · 清怪快<br>HP 86 / 伤害 30</small>
        </button>
        <button class="class-card" data-class="ranger">
          <span class="class-icon ranger">➹</span>
          <b>游侠</b>
          <small>灵活 · 长射程<br>HP 96 / 伤害 18</small>
        </button>
      </div>

      <label class="coop"><input type="checkbox" id="coop"> 本地双人（P1 剑士/所选职业 + P2 法师）</label>
      <button id="start" class="primary">开始冒险</button>

      <div class="controls">
        <div><b>P1</b> A / D 移动 · W / Space 跳跃 · J 攻击</div>
        <div><b>P2</b> ← / → 移动 · ↑ 跳跃 · K 攻击</div>
        <div><b>系统</b> F5 存档 · F9 读档 · R 重开</div>
      </div>
      <p class="footnote">这是用于验证核心循环的可运行垂直切片：4 房间、3 职业、掉落品质、Boss、存档、本地双人。正式版按设计文档扩展到 5 层章节与美术资源。</p>
    </div>
  </div>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
