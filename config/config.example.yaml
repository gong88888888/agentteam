# 复制为 config/config.yaml 使用；只允许放环境变量名，禁止写真实密钥。
runtime:
  out_dir: sim/out/v4
  workspace: workspace
  log_level: info

models:
  local:
    backend: ollama
    base_url: http://localhost:11434
    model: qwen3.6:35b-a3b-mtp-q4_K_M
    fallback_models: [qwen3.5:9b-q4_K_M]
    timeout_s: 120
    think: false   # Qwen 3.x 推理模型：关闭 thinking，直接输出 JSON
  deepseek:
    backend: deepseekharness
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    chat_path: /chat/completions
    model: deepseek-chat
    reasoner: deepseek-reasoner
    timeout_s: 120
    price_in_per_m: 0.5
    price_out_per_m: 1.5
  routing:
    # 执行 Agent：本地 Qwen 3.6 为主，DeepSeek 为补充/降级
    pm: {primary: local, fallback: deepseek}
    product: {primary: local, fallback: deepseek}
    ui: {primary: local, fallback: deepseek}
    arch: {primary: local, fallback: deepseek}
    frontend: {primary: local, fallback: deepseek}
    backend: {primary: local, fallback: deepseek}
    review: {primary: local, fallback: deepseek}
    qa: {primary: local, fallback: deepseek}
    security: {primary: local, fallback: deepseek}
    ops: {primary: local, fallback: deepseek}
    kb: {primary: local, fallback: deepseek}
    retro: {primary: local, fallback: deepseek}
    # 裁判：J1/J3 用 DeepSeek；J2 用本地 Qwen（不同家族，避免同族盲点）
    judge_j1: {primary: deepseek, fallback: local}
    judge_j2: {primary: local, fallback: deepseek}
    judge_j3: {primary: deepseek, fallback: local}

skills:
  registry: skills/registry.yaml
  root: RAG-Agent-Toolkit/agent-toolkit/skills
  inject_into_prompt: true


approval:
  mode: external_model_judge
  fail_closed: true
  judges:
    j1:
      backend: deepseekharness
      base_url_env: DEEPSEEK_HARNESS_URL
      api_key_env: DEEPSEEK_API_KEY
      model: deepseek-chat
      temperature: 0
      seed: 42
      timeout_s: 120
      max_retries: 0
    j2:
      backend: secondary-family
      base_url_env: SECOND_JUDGE_BASE_URL
      api_key_env: SECOND_JUDGE_API_KEY
      model_env: SECOND_JUDGE_MODEL
      temperature: 0
      timeout_s: 120
    j3:
      backend: deepseekharness
      base_url_env: DEEPSEEK_HARNESS_URL
      api_key_env: DEEPSEEK_API_KEY
      model: deepseek-reasoner
      temperature: 0
      timeout_s: 180
  policy:
    default: [j1]
    high_risk: [j1, j2]
    l3_or_disagreement: [j1, j2, j3]
    release: [j2, j3]
  budgets:
    per_project_usd: 50
    per_verdict_tokens: 30000
    warn_at: 0.8
    hard_stop_at: 1.0
  canary:
    rate: 0.1
    miss_rate_threshold: 0.10
    action: conservative_mode
  audit:
    sample_rate: 0.05
    blocking: false
  content_isolation:
    sanitize: true
    max_packet_bytes: 200000
    instruction_detection: true

execution:
  model_routing:
    product: strong
    arch: strong
    frontend: strong
    backend: strong
    review: strong
    security: strong
    ui: strong
    qa: strong
    ops: light
    kb: light
    retro: light
    pm: light
  budget:
    per_task_warn: 0.8
    per_task_hard_stop: 1.0
  sandbox:
    write_scope_enforced: true
    network: deny_by_default
    command_allowlist:
      - pytest
      - mypy
      - ruff
      - eslint
      - playwright
      - semgrep
      - trivy
      - git
