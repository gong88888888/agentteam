<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentTeam · 产品评审与升级预演</title>
<style>
  :root { color-scheme:light; --page:#f9f9f7; --surface:#fcfcfb; --surface2:#f3f2ee;
    --ink:#0b0b0b; --muted:#898781; --line:rgba(11,11,11,.12); --blue:#2a78d6;
    --green:#0ca30c; --red:#d03b3b; --orange:#eb6834; }
  [data-theme="dark"] { color-scheme:dark; --page:#0d0d0d; --surface:#1a1a19;
    --surface2:#222220; --ink:#fff; --muted:#898781; --line:rgba(255,255,255,.12);
    --blue:#3987e5; --green:#22c55e; --red:#ef4444; --orange:#f97316; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; font-size:14px; }
  .page { max-width:1440px; margin:0 auto; padding:30px 26px 54px; }
  .topbar { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; margin-bottom:18px; }
  .eyebrow { color:var(--muted); font-size:12px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:8px; }
  h1 { font-size:clamp(26px,3vw,36px); margin:0 0 8px; letter-spacing:-.02em; }
  .sub { color:var(--muted); max-width:760px; margin:0; }
  .controls { display:flex; gap:8px; }
  .btn { border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:10px; padding:8px 12px; font:inherit; font-size:13px; cursor:pointer; text-decoration:none; }
  .layout { display:grid; grid-template-columns:260px 380px 1fr; gap:14px; align-items:start; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; }
  .item { padding:10px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; cursor:pointer; }
  .item.active { border-color:var(--blue); box-shadow:0 0 0 2px rgba(42,120,214,.12); }
  .item b { display:block; font-size:13px; }
  .item small { color:var(--muted); font-size:11px; }
  .badge { display:inline-flex; padding:2px 8px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface2); color:var(--muted); font-size:11px; }
  .pass { color:var(--green); border-color:rgba(12,163,12,.3); }
  .fail { color:var(--red); border-color:rgba(208,59,59,.35); }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; }
  a { color:var(--blue); }
  pre { background:var(--surface2); border:1px solid var(--line); border-radius:10px;
    padding:12px; max-height:560px; overflow:auto; white-space:pre-wrap; word-break:break-word;
    font-size:12px; line-height:1.55; }
  .file { padding:8px 10px; border:1px solid var(--line); border-radius:9px; margin-bottom:6px;
    cursor:pointer; display:flex; justify-content:space-between; gap:8px; font-size:12px; }
  .empty { color:var(--muted); padding:20px 4px; font-size:13px; }
  @media (max-width:1100px) { .layout { grid-template-columns:240px 1fr; } .detail { grid-column:1/-1; } }
  @media (max-width:760px) { .layout { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div>
      <div class="eyebrow">AgentTeam · Product Review & Upgrade Rehearsal</div>
      <h1>产品评审与升级预演</h1>
      <p class="sub">产品文档深析、流程细化、版本兼容/迁移/回滚预演；发版前先看这里，再进入开发团队。</p>
    </div>
    <div class="controls">
      <a class="btn" href="projects.html">角色监控</a>
      <a class="btn" href="index.html">监控工作台</a>
      <a class="btn" href="decisions.html">决策收件箱</a>
    </div>
  </header>

  <div class="layout">
    <aside class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <b>评审</b><span class="badge" id="review-count">—</span>
      </div>
      <div id="reviews"><div class="empty">加载中…</div></div>
    </aside>
    <section class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <b id="review-title">选择评审</b><span id="review-status"></span>
      </div>
      <div id="meta" class="sub" style="font-size:12px"></div>
      <div id="gates" style="margin-top:12px"></div>
    </section>
    <main class="card detail">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <b>参考方案 / 产物</b><span class="badge" id="file-label">—</span>
      </div>
      <div id="files"></div>
      <pre id="content" class="empty">选择左侧评审和文件。</pre>
    </main>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state = { items: [], current: null };
function badge(s) { return `<span class="badge ${s === "pass" ? "pass" : "fail"}">${esc(s)}</span>`; }
async function api(path) {
  const r = await fetch(path); const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`); return d;
}
async function load() {
  try {
    const d = await api("/api/reviews");
    state.items = d.reviews || [];
    $("review-count").textContent = `${state.items.length} 个`;
    $("reviews").innerHTML = state.items.map(r => `
      <div class="item ${state.current === r.name ? "active" : ""}" data-name="${esc(r.name)}">
        <b>${esc(r.name)}</b>
        <small>${badge(r.status)} · 覆盖 ${esc(r.coverage ?? "—")}%</small>
      </div>`).join("") || `<div class="empty">reviews/ 下没有评审。先运行 start_product_review.py。</div>`;
    document.querySelectorAll(".item").forEach(el => el.addEventListener("click", () => loadReview(el.dataset.name)));
    if (!state.current && state.items.length) loadReview(state.items[0].name);
  } catch (err) { $("reviews").innerHTML = `<div class="empty">需要 dashboard/serve.py：${esc(err.message)}</div>`; }
}
async function loadReview(name) {
  state.current = name;
  const d = await api(`/api/reviews/${encodeURIComponent(name)}`);
  $("review-title").textContent = d.name;
  $("review-status").innerHTML = badge(d.status);
  $("meta").textContent = `来源 ${d.source || "—"} · 覆盖率 ${d.coverage ?? "—"}% · ${d.finished_at || ""}`;
  $("gates").innerHTML = `<table><tr><th>角色</th><th>门禁</th><th>文件</th></tr>
    ${(d.roles || []).map(r => `<tr><td>${esc(r.role)}</td>
      <td>${badge(r.gate)}</td><td>${esc((r.files || []).map(f => f.path).join(", "))}</td></tr>`).join("")}
    </table>`;
  $("files").innerHTML = (d.files || []).map(f => `
    <div class="file" data-path="${esc(f.path)}"><span>${esc(f.path)}</span><span class="badge">${esc(f.bytes)} B</span></div>`).join("") ||
    `<div class="empty">没有 artifact 文件。</div>`;
  document.querySelectorAll(".file").forEach(el => el.addEventListener("click", () => openFile(el.dataset.path)));
  const plan = (d.files || []).find(f => f.path === "REFERENCE-PLAN.md") || (d.files || [])[0];
  if (plan) openFile(plan.path);
  load();
}
async function openFile(path) {
  try {
    const d = await api(`/api/reviews/${encodeURIComponent(state.current)}/file?path=${encodeURIComponent(path)}`);
    $("file-label").textContent = path;
    $("content").textContent = d.content || "（空）";
  } catch (err) { $("content").textContent = `读取失败：${err.message}`; }
}
load();
</script>
</body>
</html>
