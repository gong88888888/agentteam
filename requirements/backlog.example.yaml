project: MiniLedger
requirements:
  - id: REQ-CSV
    title: 月度记录 CSV 导出
    description: >-
      用户可以按月份把记账记录导出为 CSV，用于个人归档和二次分析。
      导出内容包含日期、金额、分类、备注；只允许导出当前用户自己的记录。
    users: [个人用户, 小型团队]
    value: 2
    effort: 1
    risk: 1
    dependency: 0
    strategic_fit: 2
    acceptance:
      - 导出文件包含所选月份全部记录，字段为 date, amount, category, note。
      - 导出接口必须校验 owner，不能导出其他用户记录。
      - 单次导出 1 万行时 P95 < 2s；超过 10 万行返回明确错误。
      - 空数据月份导出合法空 CSV，不报错。
    non_goals:
      - 不支持 Excel 公式、图表或多 sheet。
      - 不做定时/邮件自动导出。
      - 不引入新的导出服务或消息队列。
    constraints:
      - 复用现有认证与记录查询接口。
      - 导出文件使用 UTF-8 + BOM，兼容 Excel。
      - 不改变现有记录数据结构。
    tags: [export, csv, reporting]

  - id: REQ-MULTI
    title: 多币种记账
    description: 支持人民币以外的币种与汇率换算，覆盖跨境用户。
    users: [跨境用户]
    value: 1
    effort: 2
    risk: 2
    dependency: 0
    strategic_fit: 1
    acceptance:
      - 记录支持币种字段与汇率快照。
      - 月度报表按用户主币种汇总。
      - 汇率来源与更新时间可追溯。
    non_goals:
      - 不做实时外汇交易。
      - 不做多币种税务计算。
    constraints:
      - 需要外部汇率源，涉及合规与依赖评估。
    tags: [currency, fx]

  - id: REQ-SHARED
    title: 家庭共享账本
    description: 多个用户共享一个账本并协作记账，支持权限与邀请。
    users: [家庭用户]
    value: 2
    effort: 2
    risk: 2
    dependency: 1
    strategic_fit: 1
    acceptance:
      - 账本 owner 可邀请成员并设置只读/可写。
      - 成员只能访问被授权账本。
      - 所有共享操作有审计日志。
    non_goals:
      - 不做企业级组织架构。
      - 不做实时协同编辑。
    constraints:
      - 依赖多币种/权限模型扩展，建议在 CSV 导出之后。
    tags: [sharing, permission]
