templates:
  - id: web-2d-game
    title: Playable 2D game vertical slice
    description: >-
      HTML5 Canvas side-scrolling room game with 3 classes, local co-op, boss,
      loot, HUD and save/load. Used by the game project profile and verified by
      node tests, a headless smoke and a Chrome render.
    kind: game
    engine: html5-canvas
    roles: [pm, product, ui, arch, backend, frontend, review, qa, security, ops, kb, retro]
    evidence_profile: game
  - id: minimal-api
    title: Minimal stdlib API
    description: >-
      Python stdlib service, runnable tests, OpenAPI contract and a minimal UI.
      Used to verify tool evidence and code gates end to end without
      third-party runtime dependencies.
    roles: [pm, product, ui, arch, backend, frontend, review, qa, security, ops]
    evidence_profile: standard
  - id: none
    title: No scaffold
    description: Start from an empty project directory.
    roles: []
    evidence_profile: basic
