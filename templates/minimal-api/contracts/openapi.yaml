openapi: 3.1.0
info:
  title: Minimal API scaffold
  version: 0.1.0
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
  /api/v1/exports/csv:
    get:
      summary: Export one month of records as CSV
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            example: "2026-02"
      responses:
        "200":
          description: CSV export
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Missing month
